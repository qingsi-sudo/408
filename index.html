<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="408 整机地图：一张可缩放的计算机内部结构大图，点部件学知识点，操作系统流程逐步演示。"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>408 整机地图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：顶栏 / 一张可缩放的整机大图 + 右侧讲解面板。浅色工程图风格：上半是内存里的软件，下半是一块电路板。刻意单主题。 */
:root{
  color-scheme:light;
  --ink:#f4f6f8; --stage:#eef1f5; --panel:#ffffff; --raise:#eef1f5; --line:#dfe4ea; --line2:#c3ccd7;
  --fg:#18212c; --fg2:#445162; --muted:#7a8696;
  --gold:#b26a00; --red:#c8452f; --blue:#2463b0; --jade:#16805f;
  --board:#1f5f4c; --board2:#174a3b; --trace:#d8b24a; --chip:#2e3945; --chip2:#3d4a59;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage side"}
.top{grid-area:top;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.brand i{font-style:normal;color:var(--gold)}
.search{position:relative;flex:0 1 260px;min-width:150px}
.search input{width:100%;box-sizing:border-box;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:7px 10px;font:inherit;font-size:13px}
.search input::placeholder{color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 40px rgba(20,30,45,.18);max-height:60vh;overflow:auto;z-index:40;padding:4px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:5px;cursor:pointer;font-size:13px}
.results button:hover{background:var(--raise)}
.results small{color:var(--muted);margin-right:8px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--fg2);white-space:nowrap}
.tog[aria-pressed=true],.tog[data-lv="2"],.tog[data-lv="3"]{border-color:#ff9d00;color:var(--gold);background:#fff6e5}
.tog .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tog[aria-pressed=true] .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
/* 大图 */
.stage{grid-area:stage;position:relative;overflow:hidden;min-height:0;background:var(--stage);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#map text{font-family:var(--sans);pointer-events:none}
.zone{stroke-width:1.5}
.zt{font-size:18px;font-weight:700;letter-spacing:.08em}
.zs{font-size:13px;fill:var(--muted)}
.cmp{fill:var(--panel);stroke:var(--line2);stroke-width:1.6;cursor:pointer;transition:fill .3s,stroke .3s,opacity .3s}
.cmp.box{fill:rgba(255,255,255,.55);cursor:default}
.cmp.h{fill:var(--chip2);stroke:#6a7a8e}
.cmp.h.box{fill:var(--chip);stroke:#10161d;stroke-width:2.5}
.cmp:not(.box):hover{stroke:var(--gold);stroke-width:2.6}
.cmp.hot{stroke:#ff9d00;stroke-width:4;fill:#fff1d2}
.cmp.h.hot{fill:#7a5a17;stroke:#ffc04d}
.cmp.sel{stroke:#ff9d00;stroke-width:3.4}
.playing .cmp:not(.hot):not(.box){opacity:.5}
.playing .cmp.used:not(.hot){opacity:1}
.cn{font-size:14px;font-weight:700;fill:var(--fg)}
.cn.h{fill:#f1f4f8}
.cn.c{font-size:15px;fill:var(--fg2);letter-spacing:.08em}
.cn.c.h{fill:#aeb9c7}
.cv{font-size:12.5px;font-weight:700;fill:var(--gold)}
.cv.h{fill:#ffcf70}
@keyframes flash{from{fill:#ff3d00}to{fill:var(--gold)}}
@keyframes flashh{from{fill:#fff}to{fill:#ffcf70}}
.cv.flash{animation:flash 1.1s} .cv.h.flash{animation:flashh 1.1s}
.wire{fill:none;stroke:var(--trace);stroke-width:2.4;stroke-linejoin:round}
.irq{fill:none;stroke:#ff8f7a;stroke-width:2;stroke-dasharray:6 5}
.call{fill:none;stroke:#9aa7b6;stroke-width:1.6}
.wl{font-size:12px;font-weight:700}
.pin{fill:#b9c2cc}
.bdg{fill:#ff9d00;stroke:#fff;stroke-width:1.5} .bdgt{font-size:10.5px;fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:central}
@keyframes ring2{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring2 1.4s ease-out infinite}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line2);border-radius:999px;padding:4px 12px;pointer-events:none}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoom button{width:34px;height:34px;border-radius:6px;background:#fff;border:1px solid var(--line2);cursor:pointer;font-size:15px;color:var(--fg2);display:grid;place-items:center;padding:0}
.capbar{position:absolute;left:14px;right:60px;bottom:14px;background:rgba(255,255,255,.97);box-shadow:0 8px 24px rgba(20,30,45,.14);border:1px solid var(--line2);border-left:4px solid #ff9d00;border-radius:0 8px 8px 0;padding:10px 14px;font-size:15.5px;font-weight:500;line-height:1.55;display:flex;gap:10px;align-items:center;z-index:4}
.capbar b{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.capbar .btns{margin-left:auto;display:flex;gap:6px;flex:none}
.capbar button{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--fg2);white-space:nowrap}
.capbar button.pri{background:#ff9d00;border-color:#ff9d00;color:#fff;font-weight:700}
.inset{position:absolute;left:14px;top:14px;width:min(820px,calc(100% - 28px));background:rgba(255,255,255,.98);border:1px solid var(--line2);border-radius:10px;box-shadow:0 20px 50px rgba(20,30,45,.22);z-index:3;padding:6px 8px 2px}
.inset .ih{font-size:11.5px;color:var(--muted);padding:4px 8px 0;letter-spacing:.06em}
#sv{width:100%;display:block;aspect-ratio:800/430;cursor:pointer}
/* SVG 元素 */
#sv text{font-family:var(--sans)}
#sv [data-s]{opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,1.2,.4,1)}
#sv [data-s].on{opacity:1}
#sv .pop{transform-box:fill-box;transform-origin:center;transform:scale(.7)}
#sv .pop.on{transform:scale(1)}
#sv .rise{transform:translateY(16px)} #sv .rise.on{transform:none}
#sv .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease,opacity .2s}
#sv .draw.on{stroke-dashoffset:0}
#sv .bx{fill:var(--panel);stroke-width:1.6}
#sv .t1{font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
#sv .t2{fill:var(--fg2);text-anchor:middle;dominant-baseline:central}
#sv .lb{font-weight:700;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--stage);stroke-width:5px;stroke-linejoin:round}
#sv .end{font-family:var(--serif);font-weight:900;fill:var(--gold);text-anchor:middle;dominant-baseline:central}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.9}}
#sv .glow.on{animation:glow 1.6s ease-in-out infinite}
#sv .cmp,#mini .cmp{fill:var(--panel);stroke:var(--line2);stroke-width:1.4;transition:all .35s}
#sv .cmp.big,#mini .cmp.big{fill:rgba(21,24,29,.45)}
#sv .cmp.hot{stroke:var(--gold);stroke-width:3;fill:rgba(224,168,78,.18)}
#sv .cmp.dim{opacity:.32}
#sv .cmp-g.hot line{stroke-width:4.5;opacity:1}
#mini .cmp{stroke-width:5;stroke:var(--line2)} #mini .cmp.hot{fill:var(--gold);stroke:var(--gold)} #mini .cmp-g.hot line{stroke-width:9;opacity:1}
#sv .cn{font-size:12.5px;fill:var(--fg2);font-weight:700} #sv .cn.big{font-size:13px;fill:var(--muted);letter-spacing:.08em}
#sv .cv{font-size:12.5px;fill:var(--gold);font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
@keyframes flash{from{fill:#fff}to{fill:var(--gold)}} #sv .cv.flash{animation:flash 1.1s}
@keyframes ring2{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.9)}} #sv .ring{transform-box:fill-box;transform-origin:center;animation:ring2 1.4s ease-out infinite}
#sv .sedge{stroke:var(--line2);stroke-width:2;color:var(--line2);transition:all .3s} #sv .sedge.seen{stroke:var(--fg2);color:var(--fg2)} #sv .sedge.hot{stroke:var(--gold);stroke-width:3.6;color:var(--gold)}
#sv .selab{font-size:12.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--stage);stroke-width:4px} #sv .selab.hot{fill:var(--gold);font-weight:700} #sv .selab.seen{fill:var(--fg2)}
#sv .snode{fill:var(--panel);stroke:var(--blue);stroke-width:1.8;transition:all .3s} #sv .snode.seen{stroke:var(--jade);fill:rgba(95,191,157,.16)} #sv .snode.hot{stroke:var(--gold);stroke-width:3.6;fill:rgba(224,168,78,.22)}
#sv .sord{font-size:15px;font-weight:700;fill:var(--gold);text-anchor:middle;dominant-baseline:central}
#sv .gcell{fill:transparent;stroke:var(--line);transition:fill .3s} #sv .gcell.new{stroke:var(--gold);stroke-width:2}
#sv .gcol{fill:transparent} #sv .gcol.hot{fill:rgba(224,168,78,.08)}
#sv .bar{fill:var(--blue);opacity:.85;transition:fill .3s} #sv .bar.hl{fill:var(--red)} #sv .bar.piv{fill:var(--gold)} #sv .bar.done{fill:var(--jade)}
.mini{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.mini svg{width:132px;height:71px;border:1px solid var(--line2);border-radius:6px;background:var(--ink)}
.mini span{font-size:10.5px;color:var(--muted);max-width:150px;text-align:center;line-height:1.3}

/* 面板 */
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.card{flex:1;overflow:auto;padding:18px 22px 16px;min-height:0;overscroll-behavior:contain}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:12.5px;margin-bottom:10px}
.back:hover{color:var(--fg)}
.kick{font-size:12px;color:var(--gold);letter-spacing:.14em;font-weight:700}
.ttl{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.3;margin:6px 0 10px;text-wrap:balance}
.lvtag{font-size:12px;border-radius:4px;padding:1px 8px;font-weight:700;white-space:nowrap;display:inline-block}
.lvtag.l3{background:#ff9d00;color:#fff} .lvtag.l2{border:1px solid var(--gold);color:var(--gold)} .lvtag.l1{border:1px solid var(--line2);color:var(--muted)}
.desc{font-size:14.5px;line-height:1.8;color:var(--fg2);margin:0 0 6px}
.sec{padding:14px 0 8px;border-top:1px solid var(--line);margin-top:10px}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--gold)}
.sec h3.r{color:var(--red)} .sec h3.b{color:var(--blue)} .sec h3.j{color:var(--jade)} .sec h3.m{color:var(--muted)}
.sec p{margin:0;font-size:14.5px;line-height:1.85}
mark{background:#fff1cf;color:#7a4a00;font-weight:700;border-radius:3px;padding:0 3px}
.blank mark{color:transparent;background:#ffe2a6;cursor:pointer;user-select:none}
.blank mark.show{color:#7a4a00;background:#fff1cf}
.errbox{background:#fdf0ed;border:1px solid #f1c3b9;border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.75}
.ll{display:grid;gap:2px}
.ll button{display:flex;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;font-size:13.5px;color:var(--fg2);line-height:1.45}
.ll button:hover{background:var(--raise);color:var(--fg)}
.ll button.lv3{color:var(--fg);font-weight:500}
.ll button.lv1{opacity:.65}
.ll .st{flex:none;width:12px;color:var(--gold);font-size:11px}
.ll .k{margin-left:auto;flex:none;font-size:11px;color:var(--muted);white-space:nowrap}
.ll .rd{color:var(--jade)}
.gh{margin:16px 0 4px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.steps{display:grid;gap:4px;margin-top:6px}
.sp{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--fg2);font-size:13.5px;line-height:1.6}
.sp:hover{background:var(--raise)}
.sp.done{color:var(--fg2)}
.sp.on{background:#fff8ea;border-color:#ff9d00;color:var(--fg)}
.sp .c{display:block;font-weight:500}
.sp .w,.sp .t{display:none;margin-top:6px;font-size:13.5px;line-height:1.75}
.sp.on .w,.sp.on .t,.all .sp .w,.all .sp .t{display:block}
.sp .w{color:var(--fg2);padding-left:10px;border-left:2px solid var(--blue)}
.sp .w::before{content:"底层原理　";color:var(--blue);font-weight:700;font-size:12px}
.sp .t{color:var(--fg);padding-left:10px;border-left:2px solid var(--red)}
.sp .t::before{content:"易错　";color:var(--red);font-weight:700;font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.acts button{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--fg2)}
.acts button:hover{color:var(--fg);border-color:var(--muted)}
.acts button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.src{padding:9px 22px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.src b{color:var(--fg);font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.anim>*{animation:rise .4s ease-out both}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) 360px}}
@media (max-width:900px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "stage" "side"}
  .stage{height:min(82vw,560px);position:sticky;top:0;z-index:10}
  .side{border-left:0;border-top:1px solid var(--line)}
  .card{overflow:visible}
  .tools{margin-left:0}
  .capbar{font-size:13.5px;right:54px;padding:8px 10px;flex-wrap:wrap}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">408<i> · </i>整机地图</div>
    <div class="search"><input id="q" type="search" placeholder="搜知识点、部件、关键词…" autocomplete="off" aria-label="搜索"><div class="results" id="res" hidden></div></div>
    <div class="tools">
      <button class="tog" id="tLv" title="按重要度筛选">全部知识点</button>
      <button class="tog" id="tBlank" aria-pressed="false" title="把关键词挖空，点一下显示（B）"><span class="dot"></span>挖空</button>
      <button class="tog" id="tPlay" aria-pressed="false" title="自动播完一个接下一个（空格）"><span class="dot"></span>连播</button>
    </div>
  </header>
  <section class="stage" id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="hint" id="hint">点任意部件进去学 · 双指或滚轮缩放 · 拖动平移</div>
    <div class="inset" id="inset" hidden><div class="ih" id="ih"></div><svg id="sv" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="capbar" id="capbar" hidden><b id="capn"></b><span id="capt"></span><div class="btns"><button id="cPrev">◀</button><button class="pri" id="cNext">下一步 ▶</button></div></div>
    <div class="zoom"><button id="zIn" aria-label="放大">＋</button><button id="zOut" aria-label="缩小">－</button><button id="zFit" aria-label="看全图" title="看全图">⌂</button></div>
  </section>
  <aside class="side">
    <div class="card" id="card"></div>
    <div class="src">已掌握 <b id="nRead">0</b>/<span id="nAll"></span> · 记录只存在这台设备的浏览器里</div>
  </aside>
</div>

<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/==(.+?)==/g,'<mark>$1</mark>');
const plain=s=>(s||'').replace(/==/g,'');
const C={red:'var(--red)',gold:'var(--gold)',blue:'var(--blue)',jade:'var(--jade)'};
const LV={3:'★★★ 必背',2:'★★ 重要',1:'★ 了解'};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ld=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch(e){return new Set()}};
const sv_=(k,s)=>{try{localStorage.setItem(k,JSON.stringify([...s]))}catch(e){}};
const READ=ld('m408.read');
const tw=(s,fs)=>[...String(s)].reduce((a,c)=>a+(c.charCodeAt(0)>255?fs:fs*.56),0);
const fit=(s,w,max)=>Math.max(11,Math.min(max,Math.floor(w/Math.max(1,tw(s,1)))));
function box(x,y,w,h,t,sub,c,s,cls='pop'){const f=fit(t,w-24,24),f2=sub?fit(sub,w-16,13):0;
  return `<g data-s="${s}" class="${cls}"><rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" stroke="${c}"/><rect x="${x}" y="${y}" width="${w}" height="5" rx="2.5" fill="${c}"/>
  <text class="t1" x="${x+w/2}" y="${y+h/2-(sub?10:0)}" font-size="${f}">${esc(t)}</text>${sub?`<text class="t2" x="${x+w/2}" y="${y+h/2+18}" font-size="${f2}">${esc(sub)}</text>`:''}</g>`}
function arrow(d,c,s,id){return `<path id="${id}" data-s="${s}" class="draw" d="${d}" pathLength="1" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ah)" style="color:${c}"/>
  <circle data-s="${s}" r="5" fill="${c}"><animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#${id}"/></animateMotion></circle>`}
function label(x,y,t,c,s,fs=17){return `<text data-s="${s}" class="lb rise" x="${x}" y="${y}" font-size="${fs}" fill="${c}">${esc(t)}</text>`}
function note(x,y,t,s,fs=13){return `<text data-s="${s}" class="t2 rise" x="${x}" y="${y}" font-size="${Math.min(fs,fit(t,760,fs))}">${esc(t)}</text>`}
function ending(t,s){return `<g data-s="${s}" class="pop"><rect x="${400-tw(t,fit(t,720,21))/2-22}" y="378" width="${tw(t,fit(t,720,21))+44}" height="40" rx="20" fill="rgba(224,168,78,.1)" stroke="var(--gold)"/><text class="end" x="400" y="398" font-size="${fit(t,720,21)}">${esc(t)}</text></g>`}

function genPartition(vals){const arr=vals.map((v,i)=>({v:parseInt(v),l:String(v)}));let ord=arr.map((_,i)=>i),lo=0,hi=arr.length-1;const pv=arr[0].v,steps=[];const V=p=>arr[ord[p]];

  while(lo<hi){while(lo<hi&&V(hi).v>=pv){hi--;}
    if(lo<hi){const moved=V(hi).l;[ord[lo],ord[hi]]=[ord[hi],ord[lo]];steps.push({order:[...ord],piv:0,lo,hi,hl:[ord[lo]],up:[0],cap:`high 从右往左找到比枢轴小的 ${moved}，放到 low 的位置`})}
    while(lo<hi&&V(lo).v<=pv){lo++;}
    if(lo<hi){const moved=V(lo).l;[ord[lo],ord[hi]]=[ord[hi],ord[lo]];steps.push({order:[...ord],piv:0,lo,hi,hl:[ord[hi]],up:[0],cap:`low 从左往右找到比枢轴大的 ${moved}，放到 high 的位置`})}}
  steps.push({order:[...ord],piv:0,lo,hi,done:[0],cap:`low = high，枢轴 ${arr[0].l} 落到最终位置：左边都不比它大，右边都不比它小`});return{arr,steps}}

      else{let v=0;for(let k=1;k<nf;k++)if(meta[k]<meta[v])v=k;cap=`访问 ${p}：缺页，换出${mode==='FIFO'?'最早进入内存':'最久没有被访问'}的 ${fr[v]}`;fr[v]=p;meta[v]=t}}
    fr.forEach((x,k)=>set.push([k,t,String(x),x===p?(hit>=0?'jade':'red'):'']));set.push([nf,t,hit>=0?'':'✓',hit>=0?'':'red']);

function genRR(procs,q){let t=0;const rem=procs.map(p=>p[1]),qu=procs.map((_,i)=>i),steps=[],total=rem.reduce((a,b)=>a+b);
  while(qu.length){const i=qu.shift(),run=Math.min(q,rem[i]),set=[];for(let k=0;k<run;k++)set.push([i,t+k,'█','gold']);rem[i]-=run;t+=run;if(rem[i]>0)qu.push(i);

 ff:'单处理机中处于运行态的进程最多 ==1 个==，最少 0 个；n 个进程时就绪态最多 ==n−1== 个，阻塞态最多 n 个。',
 err:'==阻塞态不能直接到运行态==，必须先回就绪队列；==就绪态不能直接到阻塞态==。PCB 是进程存在的唯一标志。'},
{ch:1,t:'时间片轮转调度（RR）',lv:3,at:['cpu'],a:{type:'grid',title:'P1 需 5、P2 需 3、P3 需 1，同时到达，时间片 q = 2',cw:60,cols:Array.from({length:_rr.total},(_,i)=>String(i)),rows:['P1','P2','P3'],steps:_rr.steps,end:'每个进程轮流运行一个时间片，用完就排到队尾'},
 yl:'时间片轮转：就绪队列按 ==FCFS== 排队，每次给队首进程一个==时间片==，用完则==剥夺 CPU、排到队尾==。属于==抢占式==，适合==分时系统==，不会饥饿。',
 ff:'计算：==周转时间 = 完成时间 − 到达时间==；==带权周转时间 = 周转时间 / 运行时间==；==等待时间 = 周转时间 − 运行时间==。',
 err:'时间片==太大==退化为 FCFS；==太小==则进程切换过于频繁，开销大。'},
{ch:1,t:'页面置换：FIFO',lv:3,at:['mem','disk'],a:{type:'grid',title:'3 个物理块，访问串 7 0 1 2 0 3 0 4 2 3',cw:56,cols:_ref.map(String),rows:['物理块 1','物理块 2','物理块 3','缺页'],steps:_fifo.steps,end:`FIFO：共缺页 ${_fifo.faults} 次，缺页率 ${_fifo.faults}/10`},
 yl:'==先进先出（FIFO）==：淘汰==最早进入内存==的页面。实现简单，但与进程实际运行规律不符，可能出现 ==Belady 异常==（物理块增多，缺页次数反而增加）。',
 ff:'做题画表：一列一次访问，标出每次是否缺页；==缺页率 = 缺页次数 / 访问总次数==。前几次装入空闲块==也算缺页==。',
 err:'只有 ==FIFO== 会出现 Belady 异常；LRU 和 OPT 属于堆栈类算法，不会。'},
{ch:1,t:'页面置换：LRU',lv:3,at:['mem','disk'],a:{type:'grid',title:'3 个物理块，访问串 7 0 1 2 0 3 0 4 2 3',cw:56,cols:_ref.map(String),rows:['物理块 1','物理块 2','物理块 3','缺页'],steps:_lru.steps,end:`LRU：共缺页 ${_lru.faults} 次；同一访问串 FIFO 是 ${_fifo.faults} 次`},
 yl:'==最近最久未使用（LRU）==：淘汰==最近最长时间没有被访问==的页面。性能接近最佳置换 OPT，但需要==寄存器和栈的硬件支持==，开销大。',
 ff:'手算技巧：缺页时==从当前位置往左（往前）看==，物理块里的页面中最后一个出现的就是要淘汰的。OPT 则是往右（往后）看。',
 err:'OPT 是理论算法==无法实现==，只用来做衡量标准；CLOCK 是 LRU 的近似，用访问位（改进型再加修改位）。'},

{ch:2,t:'TCP 三次握手',lv:3,at:['nic'],a:{type:'seq',lanes:['客户端','服务器'],msgs:[
 {f:1,t:1,txt:'LISTEN（被动打开）',c:'jade'},
 {f:0,t:1,txt:'SYN = 1，seq = x',note:[[0,'SYN-SENT']],cap:'第一次：客户端发连接请求，SYN = 1，随机选初始序号 x；不能携带数据，但消耗一个序号'},
 {f:1,t:0,txt:'SYN = 1，ACK = 1，seq = y，ack = x + 1',note:[[1,'SYN-RCVD']],cap:'第二次：服务器同意，SYN = 1、ACK = 1，自己的初始序号 y，确认号 x + 1；此时分配缓存和变量'},
 {f:0,t:1,txt:'ACK = 1，seq = x + 1，ack = y + 1',note:[[0,'ESTABLISHED'],[1,'ESTABLISHED']],cap:'第三次：客户端确认，ACK = 1，seq = x + 1，ack = y + 1；这个报文段可以携带数据'}],end:'三次握手：防止已失效的连接请求又传到服务器'},
 yl:'第一次 ==SYN=1, seq=x==；第二次 ==SYN=1, ACK=1, seq=y, ack=x+1==；第三次 ==ACK=1, seq=x+1, ack=y+1==。',
 ff:'口诀：==ack = 对方的 seq + 1==；SYN 报文段==不能带数据但消耗一个序号==；第三次握手==可以带数据==，不带数据则不消耗序号。',
 err:'服务器的资源在==第二次握手==时分配，所以会被 ==SYN 洪泛攻击==；客户端的资源在第三次握手时分配。'},
{ch:2,t:'TCP 四次挥手',lv:3,at:['nic'],a:{type:'seq',lanes:['客户端','服务器'],msgs:[
 {f:0,t:1,txt:'FIN = 1，seq = u',note:[[0,'FIN-WAIT-1']],cap:'第一次：客户端数据发完了，发 FIN，主动关闭'},
 {f:1,t:0,txt:'ACK = 1，seq = v，ack = u + 1',note:[[1,'CLOSE-WAIT'],[0,'FIN-WAIT-2']],cap:'第二次：服务器确认。此时处于半关闭：客户端不再发数据，但服务器还可以发'},
 {f:1,t:0,txt:'FIN = 1，ACK = 1，seq = w，ack = u + 1',note:[[1,'LAST-ACK']],cap:'第三次：服务器的数据也发完了，发 FIN'},
 {f:0,t:1,txt:'ACK = 1，seq = u + 1，ack = w + 1',note:[[0,'TIME-WAIT'],[1,'CLOSED']],cap:'第四次：客户端确认，然后进入 TIME-WAIT'},
 {f:0,t:0,txt:'等待 2MSL 后 CLOSED',c:'red',cap:'客户端要等 2MSL 才真正关闭：保证最后一个 ACK 能到达，并让本连接的报文段都消失'}],end:'四次挥手：TCP 是全双工，两个方向要分别关闭'},
 yl:'第一次 ==FIN=1, seq=u==；第二次 ==ACK=1, ack=u+1==（半关闭）；第三次 ==FIN=1, ACK=1, ack=u+1==；第四次 ==ACK=1, ack=w+1==，然后等待 ==2MSL==。',
 ff:'计算最短释放时间：从客户端发 FIN 算起，客户端至少要经过 1 RTT + 服务器发 FIN 的等待 + ==2MSL==。',
 err:'等 2MSL 的两个原因：保证==最后的 ACK 能到达==服务器；防止==已失效的报文段==出现在新连接中。服务器比客户端==先==进入 CLOSED。'},

 S(['disk','mem'],['disk','mem','分区引导记录'],{mem:'ROM：BIOS｜MBR｜分区引导程序'},'④ 磁盘引导程序根据分区表找到活动分区，读入它的分区引导记录',null),
 S(['disk','mem'],['disk','mem','操作系统内核'],{mem:'ROM：BIOS｜内核'},'⑤ 分区引导程序在根目录里找到启动管理器，把操作系统内核装入内存','到这一步之前，操作系统一直躺在磁盘上。'),

{g:1,t:'时钟中断与进程切换（时间片轮转）',lv:3,at:['tmr','clk','sch','pcb','rq','kstk'],init:{psw:U,pc:'P1 的指令',pcb:'P1 运行｜P2 就绪｜P3 就绪',rq:'P2 → P3',clk:'P1 剩余时间片：1'},steps:[
 S(['tmr','pic'],['tmr','pic','时钟中断'],null,'① 定时器每隔一个固定时间，发出一次时钟中断','这是分时系统和抢占式调度的硬件基础：没有时钟中断，操作系统就没有机会从用户进程手里拿回 CPU。'),
 S(['cu','psw','kstk'],['pc','kstk','P1 的断点'],{psw:K,kstk:'P1 的断点',pc:'时钟中断处理程序'},'② P1 当前指令执行完，CPU 响应中断：进入核心态，保存 P1 的断点','到这里只是“模式切换”（用户态 → 核心态），CPU 还在 P1 的上下文里，进程并没有换。','模式切换不等于进程切换。'),
 S(['idt','clk'],['idt','clk','转入处理程序'],{clk:'P1 剩余时间片：0'},'③ 时钟中断处理程序：更新系统时间，把当前进程的剩余时间片减 1',null),
 S(['clk','sch'],['clk','sch','时间片用完'],null,'④ 时间片减到 0，需要重新调度，调用调度程序','不是每次时钟中断都会切换进程：时间片没用完就直接中断返回。'),
 S(['reg','pc','pcb'],['reg','pcb','P1 的上下文'],{pcb:'P1 就绪｜P2 就绪｜P3 就绪'},'⑤ 把 P1 的上下文（寄存器、PC、PSW、栈指针等）保存进它的 PCB，状态由运行改为就绪','进程切换 = 保存旧进程的上下文 + 恢复新进程的上下文。上下文就存在 PCB（和内核栈）里。'),
 S(['pcb','rq'],['pcb','rq','P1 排到队尾'],{rq:'P2 → P3 → P1'},'⑥ P1 的 PCB 插到就绪队列的队尾',null),
 S(['sch','rq'],['rq','sch','选中 P2'],{rq:'P3 → P1'},'⑦ 调度程序按算法选出下一个进程：队首的 P2','“调度”是决定把 CPU 给谁，“切换”是真正把 CPU 交过去的动作。先调度，后切换。'),
 S(['pt','mmu','tlb'],['pt','mmu','P2 的页表始址'],{mmu:'页表寄存器 → P2 的页表',tlb:'原有内容失效'},'⑧ 切换地址空间：把 P2 的页表始址装入页表寄存器，TLB 里原来的内容失效','每个进程有自己的页表。这也是进程切换比同一进程内的线程切换开销大的原因。'),
 S(['pcb','reg'],['pcb','reg','P2 的上下文'],{pcb:'P2 运行｜P3 就绪｜P1 就绪',kstk:'P2 上次留下的断点'},'⑨ 从 P2 的 PCB 恢复它的上下文，状态由就绪改为运行',null),
 S(['kstk','pc','psw'],['kstk','pc','P2 的断点'],{psw:U,pc:'P2 的指令',kstk:'',clk:'P2 剩余时间片：2'},'⑩ 中断返回：弹出的是 P2 的断点，回到用户态，运行的已经是 P2','P1 的断点还留在 P1 自己的内核栈里，等它下次被选中时再恢复。')],
 yl:'进程切换的过程：==保存当前进程的上下文到 PCB== → 更新 PCB 状态并==移入相应队列== → ==调度程序选择==另一个进程 → 更新其 PCB → ==切换地址空间（页表）== → ==恢复其上下文==。',
 err:'==模式切换==只是 CPU 状态变化，进程没换；==进程切换==一定在==核心态==下完成。==调度==是决策，==切换==是执行。时间片轮转里，用完时间片的进程是==运行 → 就绪==，不是阻塞。'},
{g:1,t:'进程的创建',lv:3,at:['pcb','rq','p1','mm'],init:{psw:U,pcb:'P1 运行｜P2 就绪',rq:'P2'},steps:[
 S(['p1','sci'],['p1','sci','创建进程（如 fork）'],{psw:K1},'① 父进程 P1 发出创建进程的系统调用，陷入内核','引起创建进程的事件：用户登录、作业调度、提供服务、应用请求。'),
 S(['sci','pcb'],['sci','pcb','申请空白 PCB'],{pcb:'P1 运行｜P2 就绪｜P4 创建中'},'② 为新进程分配一个唯一的进程标识号，申请一个空白 PCB','PCB 是进程存在的唯一标志。PCB 申请不到，创建就失败。','PCB 是有限的；申请失败 = 创建失败。'),
 S(['pcb','mm','fl'],['pcb','fl','申请内存'],{fl:'分给 P4 若干页框'},'③ 为新进程分配资源：程序、数据、用户栈所需的内存空间等','如果资源不足（比如内存不够），这时并不是创建失败，而是进程处于创建态等待资源。','资源不足 ≠ 创建失败。'),
 S(['pcb'],null,null,'④ 初始化 PCB：填入标识信息、处理机状态信息、处理机控制信息，设置优先级',null),
 S(['pcb','rq'],['pcb','rq','P4'],{rq:'P2 → P4',pcb:'P1 运行｜P2 就绪｜P4 就绪'},'⑤ 就绪队列能接纳的话，把新进程插入就绪队列：创建态 → 就绪态',null),
 S(['sci','p1'],['sci','p1','返回'],{psw:U},'⑥ 系统调用返回，父进程继续运行；子进程等待被调度','创建原语执行期间不允许被中断。')],
 yl:'创建原语的步骤：==分配进程标识号、申请空白 PCB== → ==分配资源== → ==初始化 PCB== → ==插入就绪队列==。',
 err:'==PCB 申请失败则创建失败==；==资源不足则处于阻塞（等待）状态==，不是创建失败。父进程和子进程==共享一部分资源，但不共享虚拟地址空间==。'},
{g:1,t:'进程的阻塞与唤醒（以读磁盘为例）',lv:3,at:['bq','rq','pcb','disk','drv','sch'],init:{psw:U,pc:'P1 的指令',pcb:'P1 运行｜P2 就绪',rq:'P2',bq:'空'},steps:[
 S(['p1','sci'],['p1','sci','read()'],{psw:K1,kstk:'P1 的断点和现场'},'① P1 发出读文件的系统调用，陷入内核',null),
 S(['fs','drv'],['oft','drv','读第 n 块'],null,'② 文件系统算出要读的物理块号，把请求交给磁盘驱动程序',null),
 S(['drv','dma','disk'],['drv','disk','启动读操作'],{disk:'正在读…'},'③ 驱动向磁盘控制器写入命令，启动 I/O','磁盘是毫秒级的，CPU 是纳秒级的。让 CPU 干等，就是浪费几百万条指令的时间。'),
 S(['pcb','bq'],['pcb','bq','P1'],{pcb:'P1 阻塞｜P2 就绪',bq:'P1（等磁盘）'},'④ P1 执行阻塞原语：保存现场，状态由运行改为阻塞，进入磁盘的等待队列','阻塞是进程自己调用原语、主动放弃 CPU，所以是“主动行为”。只有运行态的进程才可能阻塞自己。'),
 S(['sch','rq','reg'],['rq','reg','P2 上 CPU'],{pcb:'P1 阻塞｜P2 运行',rq:'空',psw:U,pc:'P2 的指令',kstk:''},'⑤ 调度程序选出 P2 运行（发生进程切换），CPU 没有闲着',null),
 S(['disk','dma','pic'],['disk','pic','磁盘中断'],{disk:'读完',buf:'第 n 块数据'},'⑥ 磁盘读完了，控制器发出中断。注意：这时正在运行的是 P2',null),
 S(['pic','idt','drv'],['pic','idt','中断响应'],{psw:K,kstk:'P2 的断点'},'⑦ P2 被打断，CPU 进入磁盘中断处理程序','中断处理程序和当前被打断的进程（P2）毫无关系，它只是借用了 P2 的时间。'),
 S(['bq','rq','pcb'],['bq','rq','P1'],{pcb:'P1 就绪｜P2 运行',bq:'空',rq:'P1'},'⑧ 中断处理程序执行唤醒原语：把 P1 从等待队列摘下，状态由阻塞改为就绪，插入就绪队列','唤醒是别的进程或中断处理程序替它做的，所以是“被动行为”。阻塞和唤醒必须成对出现。','阻塞态不能直接变成运行态，中间一定要经过就绪。'),
 S(['kstk','pc'],['kstk','pc','P2 的断点'],{psw:U,kstk:''},'⑨ 中断返回，P2 继续运行。P1 要等调度程序选中它，才能回到运行态，从 read 返回',null)],
 yl:'==阻塞原语==：找到 PCB → 保护现场、状态改为阻塞 → 插入相应事件的==等待队列== → 调度其他进程。==唤醒原语==：从等待队列找到 PCB → 移出、状态改为==就绪== → 插入==就绪队列==。',
 err:'==阻塞是主动的==（自己调用），==唤醒是被动的==（别人调用）。==阻塞 → 运行不可能==直接发生。等待 I/O 完成的进程在==阻塞态==，不占用 CPU。'},
{g:1,t:'进程的终止',lv:2,at:['pcb','mm'],init:{pcb:'P1 运行｜P2 就绪',rq:'P2',psw:K1},steps:[
 S(['p1','sci'],['p1','sci','结束（如 exit）'],null,'① 进程正常结束、异常结束，或者被外界干预，都会进入终止流程',null),
 S(['pcb'],['sci','pcb','按进程标识找 PCB'],null,'② 根据进程标识符找到它的 PCB，读出进程状态',null),
 S(['pcb','sch'],['pcb','sch','停止运行'],{pcb:'P1 终止中｜P2 就绪'},'③ 如果它正在运行，立即终止执行，把 CPU 让给其他进程',null),
 S(['pcb'],null,null,'④ 如果它还有子孙进程，通常把它们也一并终止（或交给其他进程托管）',null),
 S(['pcb','mm','fs'],['pcb','fl','归还资源'],{fl:'回收 P1 的页框'},'⑤ 把它拥有的全部资源归还给父进程或操作系统',null),
 S(['pcb','rq'],['rq','reg','P2 上 CPU'],{pcb:'P2 运行',rq:'空'},'⑥ 把 PCB 从所在的队列中删除。PCB 没了，这个进程就不存在了',null)],
 yl:'终止（撤销）原语：==找到 PCB== → ==终止执行== → ==终止子孙进程== → ==归还资源== → ==删除 PCB==。',
 err:'引起终止的三类事件：==正常结束、异常结束、外界干预==。'},
{g:1,t:'信号量：P 操作与 V 操作（实现互斥）',lv:3,at:['sem','bq','rq'],init:{sem:'mutex = 1',pcb:'P1 运行｜P2 就绪',bq:'空',rq:'P2'},steps:[
 S(['p1','sem'],['p1','sem','P(mutex)'],{sem:'mutex = 0',p1:'在临界区内'},'① P1 要进临界区，先执行 P(mutex)：mutex 减 1 得 0。0 ≥ 0，申请成功，P1 进入临界区','P 操作就是“申请一个资源”。互斥信号量初值为 1，表示临界区同一时刻只许一个进程进入。'),
 S(['p2','sem'],['p2','sem','P(mutex)'],{sem:'mutex = −1',pcb:'P1 就绪｜P2 运行',rq:'P1'},'② 轮到 P2 运行，它也想进临界区，执行 P(mutex)：mutex 减 1 得 −1','P 和 V 都是原语，执行过程不会被打断，所以“减 1 再判断”不会出现两个进程同时通过的情况。'),
 S(['sem','bq'],['sem','bq','P2'],{bq:'P2（等 mutex）',pcb:'P1 运行｜P2 阻塞',rq:'空'},'③ 结果小于 0，说明资源不够：P2 阻塞自己，进入这个信号量的等待队列','信号量小于 0 时，它的绝对值就是等待队列里的进程数。进程是去睡觉而不是原地空转，符合“让权等待”。'),
 S(['p1','sem'],['p1','sem','V(mutex)'],{sem:'mutex = 0',p1:''},'④ P1 用完临界区，执行 V(mutex)：mutex 加 1 得 0','V 操作就是“释放一个资源”。'),
 S(['bq','rq'],['bq','rq','P2'],{bq:'空',rq:'P2',pcb:'P1 运行｜P2 就绪'},'⑤ 加 1 后仍然 ≤ 0，说明有进程在等：唤醒等待队列里的 P2，P2 由阻塞变为就绪',null),
 S(['p2','sem'],['rq','reg','P2 上 CPU'],{p2:'在临界区内',pcb:'P1 就绪｜P2 运行',rq:'P1'},'⑥ P2 被调度后进入临界区；它用完后再执行 V，mutex 回到 1',null)],
 yl:'==P(S)==：S 减 1；若 ==S < 0==，进程阻塞并进入等待队列。==V(S)==：S 加 1；若 ==S ≤ 0==，唤醒等待队列中的一个进程。==S > 0== 表示可用资源数；==S < 0== 时 |S| 是等待进程数。',
 ff:'实现==互斥==：信号量初值为 ==1==，P、V 夹住临界区，成对出现在==同一进程==。实现==同步==：初值为 ==0==，“前 V 后 P”，P、V 在==不同进程==。',
 err:'P、V 是==原语==。记录型信号量不存在“忙等”。'},
{g:1,t:'生产者—消费者问题',lv:3,at:['sem','buf'],init:{sem:'mutex = 1，empty = n，full = 0',buf:'缓冲区：空',p1:'生产者',p2:'消费者'},steps:[
 S(['p1','sem'],['p1','sem','P(empty)'],{sem:'mutex = 1，empty = n−1，full = 0'},'① 生产者先执行 P(empty)：申请一个空缓冲区。没有空位就在这里阻塞','empty 是同步信号量：表示空缓冲区的数量，初值为 n。'),
 S(['p1','sem'],['p1','sem','P(mutex)'],{sem:'mutex = 0，empty = n−1，full = 0'},'② 再执行 P(mutex)：申请进入临界区','mutex 是互斥信号量：保证同一时刻只有一个进程在操作缓冲区。','两个 P 的顺序不能颠倒：必须先申请资源（empty），再申请互斥（mutex）。'),
 S(['p1','buf'],['p1','buf','放入产品'],{buf:'缓冲区：1 件'},'③ 把产品放进缓冲区',null),
 S(['p1','sem'],['p1','sem','V(mutex)、V(full)'],{sem:'mutex = 1，empty = n−1，full = 1'},'④ V(mutex) 退出临界区；V(full) 告诉消费者“多了一件产品”','V 操作不会阻塞，所以两个 V 的顺序可以交换。'),
 S(['p2','sem'],['p2','sem','P(full)、P(mutex)'],{sem:'mutex = 0，empty = n−1，full = 0'},'⑤ 消费者先 P(full)：申请一件产品；再 P(mutex) 进入临界区','如果消费者先 P(mutex) 再 P(full)，而此时缓冲区是空的：它握着 mutex 睡着了，生产者永远进不来 —— 死锁。'),
 S(['buf','p2'],['buf','p2','取走产品'],{buf:'缓冲区：空',sem:'mutex = 1，empty = n，full = 0'},'⑥ 取走产品，V(mutex)、V(empty)：归还一个空位',null)],
 yl:'三个信号量：==mutex = 1==（互斥访问缓冲区）、==empty = n==（空缓冲区数）、==full = 0==（产品数）。生产者：==P(empty) → P(mutex) → 放 → V(mutex) → V(full)==；消费者：==P(full) → P(mutex) → 取 → V(mutex) → V(empty)==。',
 err:'==实现互斥的 P 操作必须放在实现同步的 P 操作之后==，否则可能死锁；V 操作的顺序无所谓。'},
/* ================= 内存管理 ================= */
{g:2,t:'分页管理的地址变换',lv:3,at:['mmu','tlb','pt','mem'],init:{mmu:'页表寄存器：始址 F，长度 M',pc:'访存指令',pt:'P1 的页表'},steps:[
 S(['cu','mmu'],['cu','mmu','逻辑地址 A'],null,'① CPU 给出逻辑地址 A，MMU 把它拆成两段：页号 P = A ÷ 页面大小，页内偏移 W = A mod 页面大小','页面大小是 2 的整数次幂时，根本不用做除法：地址的高位就是页号，低位就是偏移。'),
 S(['mmu'],null,{mmu:'比较：P < M ？'},'② 越界检查：页号 P 如果 ≥ 页表长度 M，就产生越界中断','页表长度指的是页表有多少项，也就是这个进程有多少页。'),
 S(['mmu','tlb'],['mmu','tlb','页号 P'],{tlb:'查找页号 P'},'③ 先查快表 TLB：命中的话直接得到页框号，不用访问内存里的页表','TLB 是相联存储器，按内容并行查找，速度极快，但容量小，只放最近用过的页表项。'),
 S(['mmu','pt','mem'],['mmu','pt','F + P × 页表项长度'],{tlb:'未命中'},'④ TLB 没命中：用“页表始址 + 页号 × 页表项长度”算出页表项的地址，访问内存取出页框号（第一次访存）','页表项是连续存放的，所以页号本身不用存在页表里，它是隐含的。'),
 S(['pt','mmu','tlb'],['pt','mmu','页框号 b'],{mmu:'物理地址 = b × 页面大小 + W',tlb:'装入 P → b'},'⑤ 得到页框号 b，同时把这个页表项装入 TLB；物理地址 E = b × 页面大小 + W',null),
 S(['mmu','mem'],['mmu','mem','物理地址 E'],{mem:'访问 E 号单元'},'⑥ 用物理地址访问主存，取到数据（第二次访存）',null)],
 yl:'页号 ==P = A / L==，偏移 ==W = A % L==；先做==越界检查==，再查 ==TLB==，未命中则访问==页表==得到页框号 b；物理地址 ==E = b × L + W==。',
 ff:'访存次数：单级页表无 TLB 是 ==2 次==；TLB 命中是 ==1 次==；二级页表无 TLB 是 ==3 次==。有效访问时间按命中率加权。',
 err:'页表寄存器里的“页表长度”是==页表项的个数==；页表项长度是==每一项占多少字节==，别混。'},
{g:2,t:'缺页中断的完整过程',lv:3,at:['pf','pt','fl','disk','mmu'],init:{psw:U,pc:'一条访存指令',pcb:'P1 运行｜P2 就绪',rq:'P2',pt:'该页：有效位 = 0'},steps:[

  let h=`<div class="kick">408 整机地图</div><h2 class="ttl">一台计算机里，知识点都住在哪</h2>
  <p class="desc">左边是一台完整的机器。下面那块绿色的是主板：CPU、主存和各个 I/O 接口挂在系统总线上，设备通过中断请求线找 CPU。上面是把主存“放大”后看到的东西：操作系统内核和各个用户进程。红色虚线是用户态和核心态的边界。<b style="color:var(--fg)">点任意一个部件</b>，就能看到它是什么、它身上有哪些知识点。每个流程都在这张大图上一步步演示，数据从哪来、到哪去、谁改了什么状态，都看得见。</p>
  <div class="sec"><h3>建议的学习顺序</h3><p class="desc">先看“中断与系统调用”，它是理解进程切换、缺页、I/O 的共同基础。</p></div>`;
  GROUPS.forEach((g,gi)=>{const L=LS.filter(l=>l.g===gi&&vis(l));if(!L.length)return;h+=`<div class="gh">${g}　${L.length}</div><div class="ll">${L.map(l=>lessonBtn(l)).join('')}</div>`});
  show(h)}
function openComp(id){if(MP[id][5]==='c')return;setPlay(false);st.view='comp';st.comp=id;st.cur=-1;stopAll();const m=MP[id];map.querySelector('#c_'+id).classList.add('sel');fly(boxFor([id],900));
  const L=LS.filter(l=>vis(l)&&l.at.includes(id)),L2=LS.filter(l=>vis(l)&&!l.at.includes(id)&&isFlow(l)&&l.steps.some(s=>(s.hl||[]).includes(id)));
  let h=`<button class="back" id="bk">← 返回总图</button><div class="kick">${{u:'用户空间',k:'操作系统内核',h:'硬件'}[m[6]]}</div><h2 class="ttl">${esc(m[4])}</h2><p class="desc">${esc(m[7])}</p>`;
  if(L.length)h+=`<div class="sec"><h3>这个部件上的知识点</h3><div class="ll">${L.map(l=>lessonBtn(l)).join('')}</div></div>`;
  if(L2.length)h+=`<div class="sec"><h3 class="m">它还参与了这些流程</h3><div class="ll">${L2.map(l=>lessonBtn(l)).join('')}</div></div>`;
  if(!L.length&&!L2.length)h+=`<div class="sec"><p class="desc">这个部件暂时还没有单独的知识点。</p></div>`;
  show(h);$('#bk').onclick=home}
function openLesson(id){const l=LS[id];st.view='lesson';st.cur=id;clearTimeout(timer);clearMap();$('#hint').hidden=true;$('#capbar').hidden=false;
  if(isFlow(l)){used=[...new Set(l.steps.flatMap(s=>[...(s.hl||[]),...(s.mv?[s.mv[0],s.mv[1]]:[])]))];map.classList.add('playing');$('#inset').hidden=true}
  else{scene=T[l.a.type](l.a);$('#sv').innerHTML=DEFS+scene.svg;$('#inset').hidden=false;$('#ih').textContent='图解 · 位置：'+l.at.map(k=>MP[k][4]).join(' · ');used=l.at;l.at.forEach(k=>map.querySelector('#c_'+k).classList.add('sel'));fly({x:0,y:0,w:W0,h:H0},600)}
  const n=nSteps(l);let steps='';for(let i=0;i<n;i++){const s=isFlow(l)?l.steps[i]:{};steps+=`<button class="sp" data-s="${i}"><span class="c">${esc(capOf(l,i))}</span>${s.why?`<span class="w">${esc(s.why)}</span>`:''}${s.trap?`<span class="t">${esc(s.trap)}</span>`:''}</button>`}
  let h=`<button class="back" id="bk">← 返回${st.comp?'「'+esc(MP[st.comp][4])+'」':'总图'}</button><div class="kick">${GROUPS[l.g]} · ${isFlow(l)?'大图演示':'图解'}</div><h2 class="ttl">${esc(l.t)}</h2><span class="lvtag l${l.lv}">${LV[l.lv]}</span>
  <div class="acts"><button id="aRe">↻ 从头播放</button><button id="aAll" aria-pressed="${st.all}">展开全部讲解</button><button id="aRead" aria-pressed="${READ.has(l.t)}">${READ.has(l.t)?'✓ 已掌握':'标记已掌握'}</button></div>
  <div class="sec"><h3>${isFlow(l)?'一步一步看（点任意一步跳过去）':'步骤'}</h3><div class="steps${st.all?' all':''}" id="steps">${steps}</div></div>`;
  if(l.yl)h+=`<div class="sec"><h3>要点（背这个）</h3><p>${fmt(l.yl)}</p></div>`;
  if(l.ff)h+=`<div class="sec"><h3 class="j">解题 · 计算</h3><p>${fmt(l.ff)}</p></div>`;
  if(l.err)h+=`<div class="sec"><h3 class="r">易错</h3><div class="errbox">${fmt(l.err)}</div></div>`;
  h+=`<div class="sec"><h3 class="b">涉及的部件（点了去看）</h3><div class="ll">${[...new Set([...l.at,...used])].filter(k=>MP[k]&&MP[k][5]!=='c').map(k=>`<button data-c="${k}"><span class="st"></span><span>${esc(MP[k][4])}</span></button>`).join('')}</div></div>`;
  show(h);
  $('#bk').onclick=()=>st.comp?openComp(st.comp):home();$('#aRe').onclick=()=>{setStep(0)};$('#aAll').onclick=()=>{st.all=!st.all;$('#steps').classList.toggle('all',st.all);$('#aAll').setAttribute('aria-pressed',st.all)};
  $('#aRead').onclick=()=>{READ.has(l.t)?READ.delete(l.t):READ.add(l.t);sv_('m408.read',READ);const b=$('#aRead');b.setAttribute('aria-pressed',READ.has(l.t));b.textContent=READ.has(l.t)?'✓ 已掌握':'标记已掌握';counts()};
  try{localStorage.setItem('m408.cur',l.t)}catch(e){}
  setStep(0);auto()}
function show(h){card.classList.remove('anim');card.innerHTML=h;card.classList.toggle('blank',st.blank);card.scrollTop=0;if(!RM){void card.offsetWidth;card.classList.add('anim')}counts()}
card.addEventListener('click',e=>{const m=e.target.closest('mark');if(m&&st.blank){m.classList.toggle('show');return}
  const s=e.target.closest('.sp');if(s){setPlay(false);setStep(+s.dataset.s);return}
  const b=e.target.closest('[data-l]');if(b){setPlay(false);openLesson(+b.dataset.l);return}
  const c=e.target.closest('[data-c]');if(c)openComp(c.dataset.c)});
function counts(){$('#nRead').textContent=READ.size;$('#nAll').textContent=LS.length}

/* ===== 工具 ===== */
const LVB={1:'全部知识点',2:'★★ 重要以上',3:'★★★ 只看必背'};
function paintLv(){$('#tLv').textContent=LVB[st.minLv];$('#tLv').dataset.lv=st.minLv}
$('#tLv').onclick=()=>{st.minLv=st.minLv%3+1;try{localStorage.setItem('m408.lv',st.minLv)}catch(e){}paintLv();drawMap();st.comp=null;home()};
function setBlank(v){st.blank=v;$('#tBlank').setAttribute('aria-pressed',v);card.classList.toggle('blank',v);document.querySelectorAll('.show').forEach(m=>m.classList.remove('show'))}
$('#tBlank').onclick=()=>setBlank(!st.blank);
function setPlay(v){st.play=v;$('#tPlay').setAttribute('aria-pressed',v);clearTimeout(timer);if(v){if(st.cur<0)openLesson(LS.filter(vis)[0].id);else auto()}}
$('#tPlay').onclick=()=>setPlay(!st.play);
const q=$('#q'),res=$('#res');
q.addEventListener('input',()=>{const s=q.value.trim();if(!s){res.hidden=true;return}
  const hl=LS.filter(l=>(l.t+plain(l.yl)+plain(l.err)+(l.steps||[]).map(x=>x.cap+(x.why||'')).join('')).includes(s)).slice(0,10),hc=Object.keys(MP).filter(k=>MP[k][5]!=='c'&&(MP[k][4]+MP[k][7]).includes(s)).slice(0,5);
  res.innerHTML=(hc.map(k=>`<button data-c="${k}"><small>部件</small>${esc(MP[k][4])}</button>`).join('')+hl.map(l=>`<button data-l="${l.id}"><small>${GROUPS[l.g]}</small>${esc(l.t)}</button>`).join(''))||'<div style="padding:10px;color:var(--muted)">没有找到，换个词试试</div>';res.hidden=false});
res.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();setPlay(false);if(b.dataset.c)openComp(b.dataset.c);else{st.comp=null;if(!vis(LS[+b.dataset.l])){st.minLv=1;paintLv();drawMap()}openLesson(+b.dataset.l)}res.hidden=true;q.value='';q.blur()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))res.hidden=true});
addEventListener('keydown',e=>{if(e.target.matches('input'))return;
  if(st.view==='lesson'){if(e.key==='ArrowRight'){e.preventDefault();setPlay(false);next()}else if(e.key==='ArrowLeft'){e.preventDefault();setPlay(false);setStep(st.step-1)}else if(e.key==='Escape'){setPlay(false);st.comp?openComp(st.comp):home()}}
  if(e.key===' '){e.preventDefault();setPlay(!st.play)}else if(e.key==='b'||e.key==='B')setBlank(!st.blank);else if(e.key==='0')fly({x:0,y:0,w:W0,h:H0})});
addEventListener('resize',()=>{if(st.view==='home')applyVB()});
paintLv();drawMap();home();
</script>

</body></html>
